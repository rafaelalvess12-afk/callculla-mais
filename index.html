<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calcula Mais</title><link rel="stylesheet" href="style.css"></head><body>
<section id="calculatorScreen" class="screen active"><div class="calculator"><h2>CALCULA MAIS</h2><div id="display" class="display">0</div><div class="buttons">
<button class="danger" onclick="clearCalculator()">C</button><button class="danger" onclick="deleteNumber()">⌫</button><button class="op" onclick="percent()">%</button><button class="op" onclick="operator('/')">÷</button>
<button onclick="number('7')">7</button><button onclick="number('8')">8</button><button onclick="number('9')">9</button><button class="op" onclick="operator('*')">×</button>
<button onclick="number('4')">4</button><button onclick="number('5')">5</button><button onclick="number('6')">6</button><button class="op" onclick="operator('-')">−</button>
<button onclick="number('1')">1</button><button onclick="number('2')">2</button><button onclick="number('3')">3</button><button class="op" onclick="operator('+')">+</button>
<button class="zero" onclick="number('0')">0</button><button onclick="decimal()">.</button><button class="equals" onclick="equals()">=</button></div></div></section>
<section id="loginScreen" class="screen"><div class="login"><h2>CALCULA MAIS</h2><p>Acesse ou crie seu usuário</p><input id="loginName" placeholder="Nome de usuário"><input id="loginPassword" type="password" placeholder="Senha"><button class="main" onclick="login()">ENTRAR</button><button onclick="createAccount()">CRIAR CONTA</button><button class="link" onclick="backToCalculator()">Voltar para calculadora</button><div id="generatedPassword" class="hidden"></div></div></section>
<section id="centralScreen" class="screen"><header><b>CALCULA MAIS</b><span id="currentUserName"></span><button onclick="backToCalculator()">Calculadora</button><button onclick="logout()">Sair</button></header><div class="layout"><nav><button onclick="showSection('home')">Início</button><button onclick="showSection('investigations')">Investigações</button><button onclick="showSection('user')">Meu usuário</button><button onclick="showSection('team')">Equipe</button></nav><main>
<section id="section-home" class="section active"><h1>Central de Investigação</h1><p>Bem-vindo, <span id="welcomeName"></span>!</p><div class="stats"><article>Investigações<strong id="investigationCount">0</strong></article><article>Em andamento<strong id="progressCount">0</strong></article><article>Concluídas<strong id="completedCount">0</strong></article></div><button class="main" onclick="showSection('investigations')">ABRIR INVESTIGAÇÕES</button></section>
<section id="section-investigations" class="section"><h1>Investigações</h1><button class="main" onclick="openInvestigationForm()">NOVA INVESTIGAÇÃO</button><div id="investigationForm" class="panel hidden"><input id="investigationTitle" placeholder="Título da investigação"><input id="investigationClient" placeholder="Cliente"><textarea id="investigationDescription" placeholder="Descrição da investigação"></textarea><button class="main" onclick="createInvestigation()">CRIAR</button><button onclick="closeInvestigationForm()">CANCELAR</button></div><div id="investigationList"></div></section>
<section id="section-user" class="section"><h1>Meu usuário</h1><p id="profileName"></p><p id="profileRole"></p></section><section id="section-team" class="section"><h1>Equipe</h1><div id="teamList"></div></section></main></div></section><div id="notification"></div><script src="script.js"></script></body></html>
